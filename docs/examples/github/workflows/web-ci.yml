name: Web CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # 毎日 0:00 UTC に openapi-sync-check を回す

permissions:
  contents: read
  pull-requests: write

jobs:
  static:
    name: Static checks (typecheck / lint / format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

  unit:
    name: Unit tests
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: coverage/

  component:
    name: Component tests (Vue Test Utils + MSW)
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:component

  e2e:
    name: E2E tests (Playwright)
    needs: [unit, component]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  openapi-sync-check:
    name: OpenAPI sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download latest OpenAPI from Backend Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo m-miyawaki-m/[BACKEND_REPO_NAME] --pattern 'openapi.yaml' -O openapi-latest.yaml
      - name: Regenerate orval client
        run: pnpm orval --config orval.config.ts
      - name: Verify no diff
        run: |
          if ! git diff --exit-code -- src/api/generated; then
            echo "::error::orval 生成済みファイルが OpenAPI 最新と乖離しています。pnpm orval を実行して再生成・PR してください。"
            exit 1
          fi

  build:
    name: Build & deploy (main only)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [e2e, openapi-sync-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 以下、案件に応じて S3 + CloudFront / Cloudflare Pages へデプロイ
      # - name: Deploy to S3
      #   uses: aws-actions/configure-aws-credentials@v4
      #   ...
